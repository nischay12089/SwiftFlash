[package]
name = "swiftflash"
version = "1.0.0"
edition = "2021"

[features]
default = ["recovery"]
recovery = ["dep:zstd", "dep:flate2", "dep:sevenz-rust", "dep:zip", "dep:crc32fast"]

[[bin]]
name = "swiftflash"
path = "src/main.rs"
required-features = ["recovery"]

[[bin]]
name = "swiftflash-fastboot"
path = "src/bin/swiftflash-fastboot.rs"

[dependencies]
zstd = { version = "0.13", optional = true }
flate2 = { version = "1.0", features = ["rust_backend"], default-features = false, optional = true }
sevenz-rust = { version = "0.5", optional = true }
zip = { version = "0.6", default-features = false, features = ["deflate"], optional = true }
crc32fast = { version = "1", optional = true }
ruzstd = "0.9.1"
