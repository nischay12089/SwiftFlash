name: Build SwiftFlash

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    name: Recovery / Android ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Test recovery image writer and package plans
        run: cargo test --locked --bin swiftflash

      - name: Compile recovery executable
        run: cross build --locked --release --target aarch64-unknown-linux-musl --bin swiftflash

      - name: Prepare recovery executable
        run: cp target/aarch64-unknown-linux-musl/release/swiftflash update-binary

      - name: Upload recovery executable
        uses: actions/upload-artifact@v4
        with:
          name: update-binary-aarch64
          path: update-binary
          if-no-files-found: error

  hybrid-builder-tests:
    name: Hybrid ZIP builder tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Test hybrid ZIP packaging without a device
        run: python -m unittest discover -s tests -p test_build_hybrid.py -v

  fastboot:
    name: Fastboot / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            bin_dir: windows
            extension: .exe
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
            bin_dir: linux
            extension: ""
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            bin_dir: macos
            extension: ""
          - os: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
            bin_dir: macos
            extension: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test fastboot executable
        run: cargo test --locked --no-default-features --target ${{ matrix.target }}

      - name: Compile fastboot executable
        run: cargo build --locked --release --no-default-features --bin swiftflash-fastboot --target ${{ matrix.target }}

      - name: Package host flasher
        shell: bash
        env:
          PACKAGE_NAME: swiftflash-fastboot-${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          BIN_DIR: ${{ matrix.bin_dir }}
          EXE_EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          package="dist/$PACKAGE_NAME"
          mkdir -p "$package"
          cp -R fastboot-template/. "$package/"
          cp README.md "$package/README.md"
          cp "target/$TARGET/release/swiftflash-fastboot$EXE_EXTENSION" \
            "$package/bin/$BIN_DIR/swiftflash-fastboot$EXE_EXTENSION"
          chmod +x "$package"/*.sh
          if [ "$BIN_DIR" != windows ]; then
            chmod +x "$package/bin/$BIN_DIR/swiftflash-fastboot"
          fi

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_NAME: swiftflash-fastboot-${{ matrix.platform }}
        run: Compress-Archive -Path "dist/$env:PACKAGE_NAME" -DestinationPath "dist/$env:PACKAGE_NAME.zip"

      - name: Archive Linux or macOS package
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_NAME: swiftflash-fastboot-${{ matrix.platform }}
        run: tar -czf "dist/$PACKAGE_NAME.tar.gz" -C dist "$PACKAGE_NAME"

      - name: Upload host package
        uses: actions/upload-artifact@v4
        with:
          name: swiftflash-fastboot-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  hybrid-template:
    name: Hybrid template / ${{ matrix.platform }}
    needs: [recovery, fastboot, hybrid-builder-tests]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            binary_arg: windows-binary
            bin_dir: windows
            extension: .exe
          - platform: linux-x86_64
            binary_arg: linux-binary
            bin_dir: linux
            extension: ""
          - platform: macos-arm64
            binary_arg: macos-binary
            bin_dir: macos
            extension: ""
          - platform: macos-x86_64
            binary_arg: macos-binary
            bin_dir: macos
            extension: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Download freshly built recovery executable
        uses: actions/download-artifact@v4
        with:
          name: update-binary-aarch64
          path: build/recovery
      - name: Download freshly built host package
        uses: actions/download-artifact@v4
        with:
          name: swiftflash-fastboot-${{ matrix.platform }}
          path: build/host-archive
      - name: Extract host package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host
          for archive in build/host-archive/*; do
            case "$archive" in
              *.zip) unzip -q "$archive" -d build/host ;;
              *.tar.gz) tar -xzf "$archive" -C build/host ;;
              *) printf 'Unexpected host archive: %s\n' "$archive" >&2; exit 1 ;;
            esac
          done
      - name: Build explicitly non-flashable hybrid template
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY_ARG: ${{ matrix.binary_arg }}
          BIN_DIR: ${{ matrix.bin_dir }}
          EXE_EXTENSION: ${{ matrix.extension }}
        run: |
          python tools/build_hybrid.py --template \
            --recovery-binary build/recovery/update-binary \
            "--$BINARY_ARG" "build/host/swiftflash-fastboot-$PLATFORM/bin/$BIN_DIR/swiftflash-fastboot$EXE_EXTENSION" \
            --output "dist/swiftflash-hybrid-template-$PLATFORM.zip"
      - name: Upload hybrid template (no ROM images)
        uses: actions/upload-artifact@v4
        with:
          name: swiftflash-hybrid-template-${{ matrix.platform }}
          path: dist/swiftflash-hybrid-template-${{ matrix.platform }}.zip
          if-no-files-found: error
